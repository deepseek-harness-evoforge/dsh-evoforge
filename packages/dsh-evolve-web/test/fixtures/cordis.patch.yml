# Real-DSH browser acceptance overlay. It is intentionally outside the shipped
# profile and binds only isolated test-owned paths plus one static Shadow target.
- id: evoforge-evolution
  name: dsh-evolve
  config:
    cacheRoot: !!js dshHomePath('evoforge', 'git-skills')
    feedbackDraftRoot: !!js dshHomePath('evoforge', 'private-feedback-drafts')
    supervisor:
      runRoots:
        - !!js dshHomePath('evoforge', 'plugin-delivery-runs')
      scanIntervalMs: 30000
    shadowTargets:
      - id: plugin-delivery
        skill: build-dsh-plugin
        casePackDir: !!js dshHomePath('evoforge', 'plugin-delivery-cases')
        runRoot: !!js dshHomePath('evoforge', 'plugin-delivery-runs')
