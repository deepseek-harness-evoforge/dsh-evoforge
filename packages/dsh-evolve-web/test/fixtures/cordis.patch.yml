# Template for the real-DSH browser acceptance overlay. Before use, replace the
# __...__ values with absolute test-owned paths. The shipped Bundle is unchanged.
# The fixture disables its ordinary evolution row, registers one real native
# Workspace/Session, then mounts the installed dsh-evolve artifact with the
# Workspace id returned by WorkspaceRegistry. Because that ordinary Loader row
# is disabled, keep the installed package explicit in the existing Typert Loader
# so its generated Remote descriptors remain registered with the native Gateway.
- id: typert-loader
  name: '@deepseek-ai/dsh-typert-loader'
  config:
    packages:
      - dsh-evolve

- id: evoforge-evolution
  name: dsh-evolve
  disabled: true

- insert:
    - id: evoforge-browser-workspace
      name: __EVOFORGE_BROWSER_BOOTSTRAP__
      config:
        workspacePath: __EVOFORGE_BROWSER_WORKSPACE__
        sessionId: evoforge-browser-session
        agentPreset: standard
        evolveEntry: __EVOFORGE_INSTALLED_ENTRY__
        cacheRoot: __EVOFORGE_CACHE_ROOT__
        runRoot: __EVOFORGE_RUN_ROOT__
        seedGoalMetrics: true
