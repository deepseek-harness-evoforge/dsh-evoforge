name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.7.0
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          path: .evoforge/deepseek-harness
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned DSH dependencies
        run: pnpm --dir .evoforge/deepseek-harness install --frozen-lockfile
      - name: Build pinned DSH runtime and Web artifacts
        run: pnpm --dir .evoforge/deepseek-harness build
      - name: Check repository
        env:
          DSH_EVOLVE_DSH_SOURCE_DIR: ${{ github.workspace }}/.evoforge/deepseek-harness
        run: pnpm check
      - name: Check release metadata
        run: pnpm run check:release
      - name: Verify package contents
        run: pnpm run pack:full -- --out "$RUNNER_TEMP/evoforge-full"

  assembled-darwin:
    name: macOS DSH Assembled Trial (${{ matrix.dsh.version }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        dsh:
          - version: 0.1.0-rc.5
            revision: 47f943859bef60e4160492346772ded9b24f765a
          - version: 0.1.1-rc.2
            revision: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
    steps:
      - name: Checkout EvoForge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.dsh.revision }}
          path: .evoforge/deepseek-harness
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.7.0
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install EvoForge dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned DSH dependencies
        run: pnpm --dir .evoforge/deepseek-harness install --frozen-lockfile
      - name: Build pinned DSH runtime and Web artifacts
        # The assembled tests boot the real Web profile.  build:lib alone
        # leaves both the frontend dist and some host package entrypoints
        # (notably dsh-llm/lib) absent on a clean runner.
        run: pnpm --dir .evoforge/deepseek-harness build
      - name: Build EvoForge integration packages
        run: |
          pnpm --filter dsh-evolve build
          # dsh-evolve-attention's prebuild serially builds the shared
          # Gateway/Telegram/Feishu channel peers. Do not build Telegram here
          # as well: its clean tsdown target can race that peer build and
          # remove dist/index.mjs while the assembled tests are starting.
          pnpm --filter dsh-evolve-attention build
          pnpm --filter dsh-github-review build
      - name: Materialize DSH-revision-matched Case Packs
        run: >-
          node scripts/prepare-dsh-case-packs.mjs
          --revision "${{ matrix.dsh.revision }}"
          --out "$RUNNER_TEMP/evoforge-case-packs"
      - name: Run sealed, assembled, and Local Continuity tests
        env:
          DSH_EVOLVE_DSH_SOURCE_DIR: ${{ github.workspace }}/.evoforge/deepseek-harness
          DSH_EVOLVE_CASE_PACK_ROOT: ${{ runner.temp }}/evoforge-case-packs
        run: >-
          pnpm --filter dsh-evolve exec vitest run
          test/sealed-trial-darwin.e2e.test.ts
          test/dsh-assembled-shadow.e2e.test.ts
          test/cache-safe-status-shadow.e2e.test.ts
          test/dispose-owned-watcher-shadow.e2e.test.ts
          test/profile-install-remove-shadow.e2e.test.ts
          test/shadow-jobs-dsh.e2e.test.ts
          test/delivery-outcome-store.e2e.test.ts
          test/case-pack-calibration-cli.test.ts
          test/feedback-signal-monitor.e2e.test.ts
          test/generation-store.e2e.test.ts
          test/generation-binder.e2e.test.ts
          test/generation-crash-recovery.e2e.test.ts
          test/evolution-settled-event.e2e.test.ts
      - name: Run native suite contract and clean-profile assembled gate
        env:
          DSH_EVOLVE_DSH_SOURCE_DIR: ${{ github.workspace }}/.evoforge/deepseek-harness
          DSH_EVOLVE_CASE_PACK_ROOT: ${{ runner.temp }}/evoforge-case-packs
        run: |
          pnpm --filter dsh-doctor exec vitest run \
            test/suite-native-plugin-contract.test.ts
          pnpm --filter dsh-software-delivery exec vitest run \
            test/dsh-assembled-skill.e2e.test.ts \
            test/dsh-assembled-completion.e2e.test.ts \
            test/clean-profile-suite.e2e.test.ts
          pnpm --filter dsh-github-review exec vitest run \
            test/cache-composition.e2e.test.ts \
            test/dsh-assembled-review.e2e.test.ts \
            test/package-install-remove.e2e.test.ts
          pnpm --filter dsh-doctor exec vitest run \
            test/package-install-remove.e2e.test.ts
          pnpm --filter dsh-telegram exec vitest run \
            test/cache-composition.e2e.test.ts \
            test/dsh-assembled-chat.e2e.test.ts \
            test/package-install-remove.e2e.test.ts
          pnpm --filter dsh-evolve-attention exec vitest run \
            test/package-install-remove.e2e.test.ts
          pnpm --filter dsh-goal-continuity exec vitest run \
            test/cold-resume.e2e.test.ts \
            test/process-crash.e2e.test.ts \
            test/package-install-remove.e2e.test.ts
          pnpm --filter dsh-resident exec vitest run \
            test/launchd.e2e.test.ts \
            test/package-boundary.e2e.test.ts
